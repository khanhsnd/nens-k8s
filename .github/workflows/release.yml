name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  WAILS_VERSION: v2.13.0
  NSIS_VERSION: '3.12'
  TAP_REPOSITORY: khanhsnd/homebrew-tap

jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test
        run: go test ./internal/...

      - name: Install NSIS
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'nsis.zip'
          Invoke-WebRequest -Uri "https://downloads.sourceforge.net/project/nsis/NSIS%203/$env:NSIS_VERSION/nsis-$env:NSIS_VERSION.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $env:RUNNER_TEMP -Force
          $nsis = Join-Path $env:RUNNER_TEMP "nsis-$env:NSIS_VERSION"
          if (-not (Test-Path (Join-Path $nsis 'makensis.exe'))) { throw 'NSIS unpacked but makensis.exe was not found' }
          $nsis | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Stamp the version
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = $env:TAG.TrimStart('v')
          $config = Get-Content wails.json -Raw | ConvertFrom-Json
          $config.info.productVersion = $version
          $config | ConvertTo-Json -Depth 10 | Set-Content wails.json -Encoding utf8

      - name: Build the installer
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = $env:TAG.TrimStart('v')
          wails build -platform windows/amd64 -nsis
          $built = Get-ChildItem build/bin -Filter '*-installer.exe' | Select-Object -First 1
          if ($null -eq $built) { throw 'Wails did not produce an NSIS installer' }
          Copy-Item $built.FullName "build/bin/nens-$version-windows-x64-setup.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/bin/nens-*-windows-x64-setup.exe

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test
        run: go test ./internal/...

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Stamp the version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          jq --arg version "$version" '.info.productVersion = $version' wails.json > wails.stamped.json
          mv wails.stamped.json wails.json

      - name: Build the app bundle
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          wails build -platform darwin/universal
          ditto -c -k --sequesterRsrc --keepParent build/bin/nens.app "build/bin/nens-$version-macos-universal.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: build/bin/nens-*-macos-universal.zip

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install WebKit
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Test
        run: go test ./internal/...

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Stamp the version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          jq --arg version "$version" '.info.productVersion = $version' wails.json > wails.stamped.json
          mv wails.stamped.json wails.json

      - name: Build the archive
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          wails build -platform linux/amd64 -tags webkit2_41
          staging="nens-$version-linux-x64"
          mkdir -p "$staging"
          cp build/bin/nens "$staging/nens"
          cp build/linux/nens.desktop "$staging/nens.desktop"
          cp build/appicon.png "$staging/nens.png"
          tar -czf "build/bin/$staging.tar.gz" "$staging"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: build/bin/nens-*-linux-x64.tar.gz

  publish:
    needs: [windows, macos, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksum every asset
        working-directory: dist
        run: sha256sum nens-* > checksums.txt

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Nens ${{ github.ref_name }}
          body: |
            | Platform | Asset | Updating |
            | --- | --- | --- |
            | Windows 10/11 x64 | `-windows-x64-setup.exe` | Settings → Updates installs it |
            | macOS 12+ universal | `-macos-universal.zip` | Settings → Updates opens this page |
            | Linux x64 (WebKit2GTK 4.1) | `-linux-x64.tar.gz` | Settings → Updates opens this page |

            On macOS, `brew install --cask khanhsnd/tap/nens` installs the same bundle.

            Verify a download against `checksums.txt`.

            Nothing here is signed or notarized: SmartScreen warns on Windows, and macOS
            needs `xattr -dr com.apple.quarantine nens.app` after unzipping.
          files: dist/*

  homebrew:
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macos
          path: dist

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.TAP_REPOSITORY }}
          token: ${{ secrets.RELEASES_TOKEN }}
          path: tap

      - name: Write the Cask
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          sha256=$(sha256sum "dist/nens-$version-macos-universal.zip" | cut -d ' ' -f 1)
          mkdir -p tap/Casks
          cat > tap/Casks/nens.rb <<EOF
          cask "nens" do
            version "$version"
            sha256 "$sha256"

            url "https://github.com/${{ github.repository }}/releases/download/v#{version}/nens-#{version}-macos-universal.zip"
            name "Nens"
            desc "Desktop Kubernetes client"
            homepage "https://github.com/${{ github.repository }}"

            app "nens.app"
          end
          EOF

      - name: Commit the Cask
        working-directory: tap
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git config user.name 'nens release bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Casks/nens.rb
          git diff --cached --quiet || git commit -m "Update nens to $TAG"
          git push
